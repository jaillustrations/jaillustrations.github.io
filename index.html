<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Fine-line illustrations inspired by nature, the ocean and the world around us.">
  <title>JA Illustrations — Art & Drawings</title>

  <style>
    :root {
      --background: #f6f3ec;
      --text: #292923;
      --muted: #77746c;
      --line: #ded9ce;
      --accent: #c66f43;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 27px 6%;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 11px;
      letter-spacing: 0.13em;
    }

    nav a,
    .instagram-link {
      transition: color 0.2s ease;
    }

    nav a:hover,
    .instagram-link:hover {
      color: var(--accent);
    }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 46px 6% 70px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .art-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 34px 22px;
    }

    .artwork {
  min-width: 0;
}

.artwork img {
  display: block;
  width: 100%;
  height: auto;
  background: #eae5da;
}

    .artwork-placeholder {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #eae5da;
      border: 1px solid rgba(41, 41, 35, 0.04);
    }

    .artwork-placeholder::before {
      content: "";
      position: absolute;
      width: 56%;
      height: 70%;
      border: 1px solid rgba(41, 41, 35, 0.13);
      border-radius: 48% 52% 46% 54% / 55% 43% 57% 45%;
      transform: rotate(-12deg);
    }

    .artwork-placeholder span {
      position: relative;
      z-index: 1;
      padding: 9px 12px;
      background: var(--background);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .artwork:nth-child(3n + 2) .artwork-placeholder {
      background: #e4e0d5;
    }

    .artwork:nth-child(3n) .artwork-placeholder {
      background: #eee8dd;
    }

    .artwork:nth-child(4n) .artwork-placeholder::before {
      width: 42%;
      height: 55%;
      border-radius: 50%;
      transform: rotate(20deg);
    }

    .artwork-caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      font-size: 12px;
    }

    .artwork-caption span:last-child {
      color: var(--muted);
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 24px 6%;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .instagram-link {
      letter-spacing: 0.08em;
    }

    @media (max-width: 800px) {
      .art-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 25px 14px;
      }

      main {
        padding-top: 34px;
      }
    }

    @media (max-width: 480px) {
      .site-header {
        padding: 22px 5%;
      }

      .logo {
        font-size: 14px;
      }

      nav {
        gap: 14px;
        font-size: 10px;
      }

      main {
        padding: 28px 5% 48px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 9px;
      }

      .artwork-caption {
        flex-direction: column;
        gap: 4px;
      }

      footer {
        padding: 20px 5%;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="#" aria-label="JA Illustrations home">
      JA.ILLUSTRATIONS
    </a>

    <nav aria-label="Main navigation">
      <a href="#art">ART</a>
      <a href="https://www.instagram.com/ja.illustrationss/"
         target="_blank" rel="noopener noreferrer">
        INSTAGRAM ↗
      </a>
    </nav>
  </header>

  <main id="art">
    <div class="section-heading">
      <h1>SELECTED WORKS</h1>
      <p class="section-note">Drawings inspired by the world around us.</p>
    </div>

    <section class="art-grid" aria-label="Artwork gallery">

      <article class="artwork">
  <img src="drawing-01.jpg" alt="Fine-line illustration 1">
  <div class="artwork-caption">
    <span>Drawing 01</span><span>Original artwork</span>
  </div>
</article>

<article class="artwork">
  <img src="drawing-02.jpg" alt="Fine-line illustration 2">
  <div class="artwork-caption">
    <span>Drawing 02</span><span>Original artwork</span>
  </div>
</article>

<article class="artwork">
  <img src="drawing-03.jpg" alt="Fine-line illustration 3">
  <div class="artwork-caption">
    <span>Drawing 03</span><span>Original artwork</span>
  </div>
</article>


      <article class="artwork">
  <img src="drawing-04.jpg" alt="Fine-line illustration 4">
  <div class="artwork-caption">
    <span>Drawing 04</span><span>Original artwork</span>
  </div>
</article>

<article class="artwork">
  <img src="drawing-05.jpg" alt="Fine-line illustration 5">
  <div class="artwork-caption">
    <span>Drawing 05</span><span>Original artwork</span>
  </div>
</article>

<article class="artwork">
  <img src="drawing-06.jpg" alt="Fine-line illustration 6">
  <div class="artwork-caption">
    <span>Drawing 06</span><span>Original artwork</span>
  </div>
</article>

    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> JA Illustrations</span>
    <a class="instagram-link"
       href="https://www.instagram.com/ja.illustrationss/"
       target="_blank" rel="noopener noreferrer">
      FOLLOW ON INSTAGRAM ↗
    </a>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
